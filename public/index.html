<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHATFADE JR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f1115;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #2a2f3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #151922;
    }

    .brand {
      font-weight: bold;
      font-size: 20px;
    }

    .status {
      font-size: 12px;
      color: #8ee89a;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .assistant {
      align-self: flex-start;
      background: #1d2430;
      border-bottom-left-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: #2c6bed;
      border-bottom-right-radius: 4px;
    }

    .thinking {
      opacity: 0.7;
      font-style: italic;
    }

    .input-area {
      border-top: 1px solid #2a2f3a;
      padding: 16px;
      background: #151922;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      border-radius: 12px;
      border: 1px solid #353c49;
      background: #0f1115;
      color: #fff;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
      font-weight: bold;
      background: #ffffff;
      color: #111;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .message {
        max-width: 88%;
      }

      .chat-container {
        padding: 16px;
      }

      .input-area {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="brand">CHATFADE JR</div>
    <div class="status">● ONLINE</div>
  </div>

  <div id="chat" class="chat-container">
    <div class="message assistant">
      Hola. Soy CHATFADE JR. ¿En qué puedo ayudarte?
    </div>
  </div>

  <div class="input-area">
    <textarea
      id="messageInput"
      placeholder="Escribe un mensaje..."
    ></textarea>

    <button id="sendButton">
      Enviar
    </button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    const USER_ID = "johan";
    const USER_NAME = "Johan";

    let conversationId =
      localStorage.getItem("chatfadejr_conversation_id");

    function addMessage(text, role, extraClass = "") {
      const div = document.createElement("div");

      div.className =
        "message " +
        role +
        (extraClass ? " " + extraClass : "");

      div.textContent = text;

      chat.appendChild(div);

      chat.scrollTop = chat.scrollHeight;

      return div;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) {
        return;
      }

      addMessage(message, "user");

      input.value = "";

      sendButton.disabled = true;

      const thinking = addMessage(
        "CHATFADE JR está pensando...",
        "assistant",
        "thinking"
      );

      try {
        const body = {
          userId: USER_ID,
          name: USER_NAME,
          message: message
        };

        if (conversationId) {
          body.conversationId = Number(conversationId);
        }

        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        const data = await response.json();

        thinking.remove();

        if (!response.ok || data.status !== "ok") {
          addMessage(
            data.message || "Ocurrió un error.",
            "assistant"
          );
          return;
        }

        if (data.conversation?.id) {
          conversationId = data.conversation.id;

          localStorage.setItem(
            "chatfadejr_conversation_id",
            conversationId
          );
        }

        addMessage(
          data.response || "Sin respuesta.",
          "assistant"
        );

      } catch (error) {
        thinking.remove();

        addMessage(
          "No pude comunicarme con el servidor.",
          "assistant"
        );

        console.error(error);
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      function(event) {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );
  </script>

</body>
</html>
